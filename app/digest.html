<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Weekly Execution Digest | Meeting-to-Execution Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">
    <div class="max-w-6xl mx-auto p-6 md:p-10 space-y-8">
        <!-- Top Nav -->
        <div
            class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-5">
            <div>
                <a href="/" class="text-xs text-indigo-600 font-semibold hover:underline flex items-center gap-1 mb-1">
                    ← Back to Live Dashboard
                </a>
                <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                    <span>📊 Weekly Execution Digest</span>
                    <span id="dateBadge"
                        class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full font-medium border border-indigo-100"></span>
                </h1>
                <p class="text-xs md:text-sm text-slate-500 mt-1">Individual action tracks and ticket execution status
                    across meetings.</p>
            </div>
            <div class="flex gap-2">
                <button onclick="window.print()"
                    class="bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-3.5 py-2 rounded-md text-xs font-semibold shadow-sm transition">
                    🖨️ Print / Save PDF
                </button>
                <a href="/"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md text-xs font-semibold shadow-sm transition">
                    Dashboard
                </a>
            </div>
        </div>

        <!-- KPI Metrics -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-[11px] font-bold uppercase text-slate-400">Total Open Tickets</div>
                <div id="statOpen" class="text-2xl font-black text-indigo-600 mt-1">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-[11px] font-bold uppercase text-slate-400">Completed / Closed Tickets</div>
                <div id="statClosed" class="text-2xl font-black text-emerald-600 mt-1">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-[11px] font-bold uppercase text-slate-400">Active Contributors</div>
                <div id="statMembers" class="text-2xl font-black text-slate-700 mt-1">0</div>
            </div>
        </div>

        <!-- Member Action Item Breakdowns -->
        <div class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <span>👤 Individual Action Plans</span>
                </h2>
                <span class="text-xs text-slate-400">Live tracker sync</span>
            </div>
            <div id="membersContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-full bg-white p-8 rounded-xl border text-center text-slate-400 italic">
                    Loading digest data...
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchDigest() {
            const res = await fetch('/api/digests/weekly');
            const data = await res.json();
            const digest = data.weekly_digests || {};
            const members = digest.members || {};

            document.getElementById('dateBadge').innerText = digest.generated_at || 'Current Week';

            // Calculate KPIs
            let totalOpen = 0;
            let totalClosed = 0;
            const memberNames = Object.keys(members);

            memberNames.forEach(m => {
                totalOpen += (members[m].open_tasks || []).length;
                totalClosed += (members[m].closed_tasks || []).length;
            });

            document.getElementById('statOpen').innerText = totalOpen;
            document.getElementById('statClosed').innerText = totalClosed;
            document.getElementById('statMembers').innerText = memberNames.length;

            // Render Member Cards
            const mContainer = document.getElementById('membersContainer');
            if (memberNames.length === 0) {
                mContainer.innerHTML = '<div class="col-span-full bg-white p-8 rounded-xl border border-slate-200 text-center text-slate-400 italic">No action items assigned yet. Ingest transcripts and confirm tickets first!</div>';
            } else {
                mContainer.innerHTML = '';
                memberNames.forEach(name => {
                    const info = members[name];
                    const openTasks = info.open_tasks || [];
                    const closedTasks = info.closed_tasks || [];

                    let openListHtml = openTasks.length === 0
                        ? '<p class="text-xs text-slate-400 italic">No open tasks remaining 🎉</p>'
                        : openTasks.map(t => `
                            <li class="flex justify-between items-start bg-slate-50 border border-slate-200 p-2.5 rounded-lg text-xs">
                                <div>
                                    <div class="font-bold text-slate-800">${t.title}</div>
                                    <div class="text-[10px] text-slate-400 font-mono mt-0.5">${t.id}</div>
                                </div>
                                <span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-medium font-mono flex-shrink-0 ml-2">Due ${t.deadline}</span>
                            </li>
                        `).join('');

                    let closedListHtml = closedTasks.length === 0 ? '' : `
                        <div class="mt-4 pt-3 border-t border-slate-100">
                            <div class="text-[10px] font-bold uppercase text-slate-400 mb-2">Completed / Closed (${closedTasks.length})</div>
                            <ul class="space-y-1.5">
                                ${closedTasks.map(t => `
                                    <li class="flex justify-between items-center text-xs text-slate-400 bg-slate-50/50 p-2 rounded">
                                        <span class="line-through">${t.title}</span>
                                        <span class="text-[10px] font-mono text-emerald-600 font-bold">✓ CLOSED</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    `;

                    mContainer.innerHTML += `
                        <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-3">
                            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                                <div class="flex items-center gap-2.5">
                                    <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-sm">
                                        ${name.charAt(0).toUpperCase()}
                                    </div>
                                    <div>
                                        <div class="font-bold text-slate-900 text-sm">@${name}</div>
                                        <div class="text-[11px] text-slate-400">${openTasks.length} open · ${closedTasks.length} closed</div>
                                    </div>
                                </div>
                                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${openTasks.length > 0 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">
                                    ${openTasks.length > 0 ? 'Active' : 'All Clear'}
                                </span>
                            </div>

                            <div>
                                <div class="text-[10px] font-bold uppercase text-slate-400 mb-2">Pending Execution (${openTasks.length})</div>
                                <ul class="space-y-2">
                                    ${openListHtml}
                                </ul>
                            </div>

                            ${closedListHtml}
                        </div>
                    `;
                });
            }
        }

        fetchDigest();
    </script>
</body>

</html>
